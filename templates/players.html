<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Players • BattleX</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen" style="background:linear-gradient(180deg,#f8fafc 0%,#e2e8f0 100%); color:#0f172a;">
  {% include '_navbar.html' %}

  <div class="max-w-5xl mx-auto mt-12 pt-20 px-4">
    <h2 class="text-3xl font-bold mb-6 text-orange-500">Registered Users</h2>
    <table class="w-full border border-slate-200 text-left shadow-md bg-white rounded-lg overflow-hidden">
      <thead class="bg-slate-100 text-slate-800">
        <tr>
          <th class="p-3">Username</th>
          <th class="p-3">Role</th>
          <th class="p-3">Game ID</th>
          <th class="p-3">Phone</th>
        </tr>
      </thead>
      <tbody>
        {% for p in players %}
        <tr class="border-t border-slate-200 hover:bg-slate-50">
          <td class="p-3 text-slate-900">{{ p[0] }}</td>
          <td class="p-3 text-slate-700">{{ p[1] }}</td>
          <td class="p-3 text-slate-700">{{ p[2] or '-' }}</td>
          <td class="p-3 text-slate-700">{{ p[3] or '-' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
