databases:
  - name: battlex-db
    databaseName: battlex
    user: battlex

services:
  - type: web
    name: battlex
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: battlex-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: battlex-data
      mountPath: /var/data
      sizeGB: 1
