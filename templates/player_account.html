<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Account • BATTLE-X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(180deg,#f8fafc 0%,#e2e8f0 100%); color: #0f172a; }
    .glass-nav { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
    .account-card { background: #ffffff; border-radius: 18px; box-shadow: 0 18px 32px rgba(148,163,184,0.22); border:1px solid #e2e8f0; }
    .logo { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #fbbf24); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; color: #111827; box-shadow: 0 10px 24px rgba(249,115,22,0.2); }
  </style>
</head>
<body>
  {% include '_navbar.html' %}
  <div class="max-w-xl mx-auto pt-16 pb-12 px-4">
    <div class="account-card p-8">
      <h2 class="text-3xl font-bold mb-6 text-orange-500">My Account</h2>
      <div class="space-y-4 text-slate-700">
        <div><span class="font-semibold text-slate-500">Username:</span> {{ user[0] }}</div>
        <div><span class="font-semibold text-slate-500">Email:</span> {{ user[1] }}</div>
        <div><span class="font-semibold text-slate-500">Game ID:</span> {{ user[2] }}</div>
        <div><span class="font-semibold text-slate-500">Phone:</span> {{ user[3] }}</div>
      </div>
    </div>
  </div>
</body>
</html>
