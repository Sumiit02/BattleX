<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | BattleX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; box-shadow: 0 18px 36px rgba(148,163,184,0.2); }
  </style>
</head>
<body>
  {% include '_navbar.html' %}

  <main class="max-w-2xl mx-auto px-4 pt-8 pb-16">
    <section class="card p-8 text-center">
      <div class="mx-auto mb-4 h-14 w-14 rounded-full bg-green-100 text-green-700 flex items-center justify-center text-2xl font-bold">✓</div>
      <h1 class="text-3xl font-bold text-green-700">Payment Successful</h1>
      <p class="mt-2 text-slate-600">Your registration payment was completed successfully.</p>

      {% if payment_id %}
      <div class="mt-5 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700">
        Payment Reference: <span class="font-semibold">{{ payment_id }}</span>
      </div>
      {% endif %}

      <div class="mt-6 flex flex-wrap justify-center gap-2">
        <a href="/history" class="rounded-xl px-4 py-2.5 bg-orange-500 text-white font-semibold hover:bg-orange-600">View History</a>
        <a href="/freefire" class="rounded-xl px-4 py-2.5 border border-slate-300 text-slate-700 font-semibold hover:bg-slate-50">Join More Events</a>
      </div>
    </section>
  </main>
</body>
</html>
