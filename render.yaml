databases:
  - name: battlex-db
    databaseName: battlex
    user: battlex

services:
  - type: web
    name: battlex
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: battlex-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: CASHFREE_ENV
        value: production
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_WEBHOOK_REQUIRE_SIGNATURE
        value: "1"
      - key: CASHFREE_API_VERSION
        value: 2023-08-01
      - key: CASHFREE_PAYOUTS_ENABLED
        value: "1"
      - key: CASHFREE_PAYOUTS_BASE_URL
        value: https://api.cashfree.com/payout/v1
      - key: CASHFREE_PAYOUTS_REQUEST_PATH
        value: /requestTransfer
      - key: CASHFREE_PAYOUTS_STATUS_PATH
        value: /getTransferStatus
      - key: CASHFREE_PAYOUTS_SOURCE
        value: battlex
      - key: CASHFREE_PAYOUTS_METHOD_BANK
        value: banktransfer
      - key: CASHFREE_PAYOUTS_METHOD_UPI
        value: upi
      - key: CASHFREE_PAYOUTS_CLIENT_ID
        sync: false
      - key: CASHFREE_PAYOUTS_SECRET_KEY
        sync: false
      - key: CASHFREE_PAYOUTS_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_PAYOUTS_REQUIRE_SIGNATURE
        value: "1"
      - key: CASHFREE_WEBHOOK_REQUIRE_SIGNATURE
        value: "1"
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: battlex-data
      mountPath: /var/data
      sizeGB: 1
